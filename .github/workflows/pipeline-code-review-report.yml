name: OpenCode Review Report

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number
      model:
        description: 'Primary review model ID (optional). Overrides the OPENCODE_REVIEW_REPORT_MODEL_PRIMARY Variable.'
        required: false
        type: string
        default: ''
      disable_claude_code:
        description: 'Disable Claude Code (.claude) support (1=disabled, 0=enabled)'
        required: false
        type: choice
        default: '1'
        options:
          - '1'
          - '0'
      disable_agents_md_check:
        description: 'Disable AGENTS.md documentation validation (1=disabled, 0=enabled)'
        required: false
        type: choice
        default: '0'
        options:
          - '0'
          - '1'
      bypass_mandatory_context_file:
        description: 'Bypass AGENTS.md checks and mandatory context file loading (1=bypassed, 0=normal)'
        required: false
        type: choice
        default: '0'
        options:
          - '0'
          - '1'

permissions:
  pull-requests: write
  contents: read
  issues: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ai-review-{0}', github.event.pull_request.number) || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  review:
    name: AI Code Review
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/ai-review') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.repository }}

      - name: Checkout smooth-ai-report-review (pinned SHA)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: generic-automation-and-it/smooth-ai-report-review
          ref: ab017f2acb4b080128b7e38938798ec98f5db4eb # v1
          path: .review-tools

      - name: Run review gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWER_INPUT: ${{ inputs.pr_number }}
          OPENCODE_REVIEW_REPORT_PROVIDER: OPEN_ROUTER
          OPENCODE_OPENROUTER_API_KEY: ${{ secrets.OPENCODE_OPENROUTER_API_KEY }}
          OPENCODE_REVIEW_REPORT_MODEL_PRIMARY: ${{ inputs.model || vars.OPENCODE_REVIEW_REPORT_MODEL_PRIMARY || 'minimax/minimax-m3' }}
          OPENCODE_REVIEW_REPORT_MODEL_SECONDARY: ${{ vars.OPENCODE_REVIEW_REPORT_MODEL_SECONDARY || 'minimax/minimax-m2.7' }}
          OPENCODE_REVIEW_REPORT_MODEL_ORCHESTRATOR: ${{ vars.OPENCODE_REVIEW_REPORT_MODEL_ORCHESTRATOR || 'minimax/minimax-m3' }}
          OPENCODE_REVIEW_REPORT_DISABLE_CLAUDE_CODE: ${{ inputs.disable_claude_code || vars.OPENCODE_REVIEW_REPORT_DISABLE_CLAUDE_CODE || '1' }}
          OPENCODE_REVIEW_REPORT_DISABLE_AGENTS_MD_CHECK: ${{ inputs.disable_agents_md_check || vars.OPENCODE_REVIEW_REPORT_DISABLE_AGENTS_MD_CHECK || '0' }}
          OPENCODE_REVIEW_REPORT_BYPASS_MANDATORY_CONTEXT_FILE: ${{ inputs.bypass_mandatory_context_file || '' }}
          REVIEW_SKILL_DIR: .review-tools/.agents/skills/ai-review-report
        run: bash "$REVIEW_SKILL_DIR/scripts/run-review.sh"

      - name: Post Error Comment
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          PR_NUMBER=""
          if [ -f "$GITHUB_EVENT_PATH" ]; then
            PR_NUMBER="$(jq -r 'if .pull_request then .pull_request.number elif .issue then .issue.number elif .inputs then .inputs.pr_number else "" end' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "")"
          fi
          if [ -n "$PR_NUMBER" ]; then
            mkdir -p ci_temp
            cat > ci_temp/error_comment.md <<EOF
          ## ❌ OpenCode CLI Code Review Workflow Failed

          The automated code review workflow encountered a critical failure and could not complete.

          *Next Steps:*
          - Check the [workflow logs](${LOGS_URL}) for detailed error information
          - You can manually trigger a review by commenting \/ai-review\ on this PR
          - Consider reviewing the changes manually if the issue persists

          ---
          This PR is blocked until the review issue is resolved or manual review is completed.
          EOF
            gh pr comment "${PR_NUMBER}" --body-file ci_temp/error_comment.md || true
          fi

      - name: Clean up temporary files
        if: always()
        run: rm -rf ci_temp